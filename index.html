<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Saudi Plate Reader</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: #080808;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    overflow: hidden;
}
#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
}
.overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
}
.scan-box {
    position: absolute;
    width: 82%;
    max-width: 500px;
    aspect-ratio: 2.7 / 1;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);
    border: 3px solid rgba(255,255,255,.9);
    border-radius: 14px;
    box-shadow:
        0 0 0 9999px rgba(0,0,0,.38),
        0 0 25px rgba(255,255,255,.25);
}
.scan-line {
    position: absolute;
    width: 100%;
    height: 2px;
    background: #fff;
    box-shadow: 0 0 12px #fff;
    animation: scan 2.2s linear infinite;
}
@keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
}
.top {
    position: fixed;
    top: env(safe-area-inset-top, 20px);
    left: 0;
    width: 100%;
    padding: 18px;
    z-index: 5;
}
.title {
    font-size: 23px;
    font-weight: 700;
}
.subtitle {
    margin-top: 4px;
    opacity: .65;
    font-size: 13px;
}
.bottom {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 20px);
    left: 0;
    width: 100%;
    padding: 18px;
    z-index: 5;
}
.result {
    background: rgba(15,15,15,.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
    padding: 16px;
}
.label {
    font-size: 11px;
    opacity: .55;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.plate {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-top: 4px;
}
.status {
    margin-top: 8px;
    font-size: 13px;
    opacity: .7;
}
button {
    width: 100%;
    margin-top: 12px;
    height: 48px;
    border: 0;
    border-radius: 14px;
    background: #fff;
    color: #000;
    font-size: 16px;
    font-weight: 700;
}
#start {
    position: fixed;
    z-index: 20;
    inset: 0;
    background: #080808;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
}
#start h1 {
    font-size: 32px;
    margin: 0 0 10px;
}
#start p {
    opacity: .6;
    line-height: 1.5;
    max-width: 350px;
}
canvas {
    display: none;
}
</style>
</head>
<body>
<div id="start">
    <h1>🇸🇦 Saudi Plate Reader</h1>
    <p>
        Point your rear camera at a Saudi license plate.
        The reader will continuously scan the camera feed.
    </p>
    <button onclick="startCamera()">Start Camera</button>
</div>
<video id="camera" autoplay playsinline muted></video>
<div class="overlay">
    <div class="scan-box">
        <div class="scan-line"></div>
    </div>
</div>
<div class="top">
    <div class="title">Saudi Plate Reader</div>
    <div class="subtitle">LIVE CAMERA • OCR</div>
</div>
<div class="bottom">
    <div class="result">
        <div class="label">Detected Plate</div>
        <div class="plate" id="plate">---</div>
        <div class="status" id="status">Waiting for camera...</div>
        <button onclick="scanNow()">Scan Now</button>
    </div>
</div>
<canvas id="canvas"></canvas>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const plateOutput = document.getElementById("plate");
const statusOutput = document.getElementById("status");
const startScreen = document.getElementById("start");
let stream = null;
let worker = null;
let scanning = false;
async function startCamera() {
    try {
        statusOutput.textContent = "Requesting camera...";
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1920
                },
                height: {
                    ideal: 1080
                }
            },
            audio: false
        });
        video.srcObject = stream;
        startScreen.style.display = "none";
        statusOutput.textContent = "Camera active — point at a plate";
        await video.play();
        worker = await Tesseract.createWorker("eng");
        setTimeout(scanNow, 1200);
    } catch (error) {
        console.error(error);
        statusOutput.textContent =
            "Camera failed. Make sure you allowed camera access and are using HTTPS.";
        alert(
            "Camera access failed.\n\n" +
            "Make sure this page is opened using HTTPS and camera access is allowed."
        );
    }
}
async function scanNow() {
    if (scanning || !worker || video.readyState < 2) return;
    scanning = true;
    statusOutput.textContent = "Scanning...";
    try {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) {
            scanning = false;
            return;
        }
        /*
            Crop the center area where the scan box appears.
        */
        const cropWidth = Math.floor(vw * 0.82);
        const cropHeight = Math.floor(cropWidth / 2.7);
        const x = Math.floor((vw - cropWidth) / 2);
        const y = Math.floor(vh * 0.43 - cropHeight / 2);
        canvas.width = cropWidth;
        canvas.height = cropHeight;
        ctx.drawImage(
            video,
            x,
            y,
            cropWidth,
            cropHeight,
            0,
            0,
            cropWidth,
            cropHeight
        );
        const result = await worker.recognize(canvas);
        const text = result.data.text
            .toUpperCase()
            .replace(/[^A-Z0-9\u0660-\u0669\u06F0-\u06F9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();
        if (text.length >= 2) {
            const formatted = formatSaudiPlate(text);
            plateOutput.textContent = formatted;
            statusOutput.textContent = "Plate detected";
        } else {
            statusOutput.textContent = "No plate detected";
        }
    } catch (error) {
        console.error(error);
        statusOutput.textContent = "Scan error";
    }
    scanning = false;
    setTimeout(scanNow, 1800);
}
function formatSaudiPlate(text) {
    /*
        Saudi plates commonly contain Arabic letters,
        Latin equivalents and numbers.
        This doesn't contact any government database.
        It only reads visible characters from the camera.
    */
    const cleaned = text
        .replace(/\s+/g, " ")
        .trim();
    const numbers = cleaned.match(/[0-9\u0660-\u0669\u06F0-\u06F9]+/g);
    const letters = cleaned.match(/[A-Z]+/g);
    if (numbers && letters) {
        return letters.join("") + " " + numbers.join("");
    }
    return cleaned || "---";
}
window.addEventListener("beforeunload", () => {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
    if (worker) {
        worker.terminate();
    }
});
</script>
</body>
</html>
