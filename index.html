<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Plate Reader</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    min-height: 100vh;
}
.app {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding: 18px;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}
.title {
    font-size: 25px;
    font-weight: 800;
}
.status {
    font-size: 12px;
    color: #888;
}
.camera {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #111;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid #292929;
}
video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.scan-box {
    position: absolute;
    width: 75%;
    height: 22%;
    left: 12.5%;
    top: 39%;
    border: 2px solid white;
    border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.35);
}
.scan-label {
    position: absolute;
    top: calc(39% - 30px);
    width: 100%;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
}
.controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}
button {
    flex: 1;
    border: 0;
    border-radius: 14px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    background: #fff;
    color: #000;
}
button.secondary {
    background: #1b1b1b;
    color: white;
    border: 1px solid #303030;
}
button:active {
    transform: scale(.97);
}
.result {
    margin-top: 18px;
    background: #111;
    border: 1px solid #292929;
    border-radius: 20px;
    padding: 18px;
}
.result-title {
    color: #777;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.plate {
    margin-top: 7px;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 5px;
    word-break: break-all;
}
.confidence {
    margin-top: 7px;
    color: #777;
    font-size: 13px;
}
.history {
    margin-top: 18px;
}
.history-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 10px;
}
.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    border: 1px solid #222;
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 8px;
}
.history-plate {
    font-weight: 800;
    letter-spacing: 2px;
}
.history-time {
    color: #666;
    font-size: 12px;
}
#canvas {
    display: none;
}
.loading {
    display: none;
    margin-top: 10px;
    color: #aaa;
    text-align: center;
    font-size: 13px;
}
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="title">Plate Reader</div>
        <div class="status" id="status">Camera offline</div>
    </div>
    <div class="camera">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-label">
            POSITION PLATE INSIDE BOX
        </div>
        <div class="scan-box"></div>
    </div>
    <div class="controls">
        <button id="start">Start Camera</button>
        <button id="scan" class="secondary">Scan Plate</button>
    </div>
    <div class="controls">
        <button id="torch" class="secondary">Flashlight</button>
        <button id="clear" class="secondary">Clear History</button>
    </div>
    <div class="loading" id="loading">
        Reading plate...
    </div>
    <div class="result">
        <div class="result-title">Detected Plate</div>
        <div class="plate" id="plate">---</div>
        <div class="confidence" id="confidence">
            Waiting for scan
        </div>
    </div>
    <div class="history">
        <div class="history-title">Scan History</div>
        <div id="history"></div>
    </div>
</div>
<canvas id="canvas"></canvas>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const startButton = document.getElementById("start");
const scanButton = document.getElementById("scan");
const torchButton = document.getElementById("torch");
const clearButton = document.getElementById("clear");
const statusText = document.getElementById("status");
const plateText = document.getElementById("plate");
const confidenceText = document.getElementById("confidence");
const loading = document.getElementById("loading");
const historyContainer = document.getElementById("history");
let stream = null;
let track = null;
let torchEnabled = false;
let history = JSON.parse(
    localStorage.getItem("plateHistory") || "[]"
);
function updateHistory() {
    historyContainer.innerHTML = "";
    if (history.length === 0) {
        historyContainer.innerHTML =
            '<div style="color:#666;font-size:13px;">No scans yet</div>';
        return;
    }
    history.slice().reverse().forEach(item => {
        const element = document.createElement("div");
        element.className = "history-item";
        element.innerHTML = `
            <div class="history-plate">${item.plate}</div>
            <div class="history-time">${item.time}</div>
        `;
        historyContainer.appendChild(element);
    });
}
async function startCamera() {
    try {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
        }
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1920
                },
                height: {
                    ideal: 1080
                }
            },
            audio: false
        });
        video.srcObject = stream;
        track = stream.getVideoTracks()[0];
        statusText.textContent = "Camera active";
        startButton.textContent = "Restart Camera";
    } catch (error) {
        console.error(error);
        statusText.textContent = "Camera permission denied";
        alert(
            "Camera access failed. Make sure you opened this page using HTTPS and allowed camera access."
        );
    }
}
async function scanPlate() {
    if (!stream) {
        alert("Start the camera first.");
        return;
    }
    if (video.videoWidth === 0) {
        alert("Camera is still loading.");
        return;
    }
    loading.style.display = "block";
    scanButton.disabled = true;
    const width = video.videoWidth;
    const height = video.videoHeight;
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );
    try {
        const result = await Tesseract.recognize(
            canvas,
            "eng",
            {
                logger: message => {
                    if (message.status === "recognizing text") {
                        const percent =
                            Math.round((message.progress || 0) * 100);
                        confidenceText.textContent =
                            `OCR ${percent}%`;
                    }
                }
            }
        );
        let text = result.data.text
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "");
        if (!text) {
            plateText.textContent = "---";
            confidenceText.textContent =
                "No plate detected";
        } else {
            /*
             * OCR is not a dedicated license-plate detector,
             * so this cleans the result into a plate-like value.
             */
            text = text.substring(0, 10);
            plateText.textContent = text;
            confidenceText.textContent =
                `OCR confidence: ${Math.round(result.data.confidence)}%`;
            const now = new Date();
            const time = now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
            history.push({
                plate: text,
                time: time
            });
            history = history.slice(-20);
            localStorage.setItem(
                "plateHistory",
                JSON.stringify(history)
            );
            updateHistory();
        }
    } catch (error) {
        console.error(error);
        plateText.textContent = "---";
        confidenceText.textContent =
            "OCR failed";
    }
    loading.style.display = "none";
    scanButton.disabled = false;
}
async function toggleTorch() {
    if (!track) {
        alert("Start the camera first.");
        return;
    }
    const capabilities = track.getCapabilities();
    if (!capabilities.torch) {
        alert(
            "Your browser/device does not expose flashlight control."
        );
        return;
    }
    torchEnabled = !torchEnabled;
    await track.applyConstraints({
        advanced: [
            {
                torch: torchEnabled
            }
        ]
    });
    torchButton.textContent =
        torchEnabled ? "Flashlight On" : "Flashlight";
}
startButton.addEventListener(
    "click",
    startCamera
);
scanButton.addEventListener(
    "click",
    scanPlate
);
torchButton.addEventListener(
    "click",
    toggleTorch
);
clearButton.addEventListener(
    "click",
    () => {
        history = [];
        localStorage.removeItem(
            "plateHistory"
        );
        updateHistory();
    }
);
updateHistory();
</script>
</body>
</html>
